[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prmshift"
version = "0.1.0"
description = "Research implementation of conditional selection-risk training for causal process verifiers"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26", "PyYAML>=6", "requests>=2.31"]

[project.optional-dependencies]
hf = ["transformers>=4.46", "datasets>=3", "peft>=0.13", "accelerate>=1", "sentencepiece", "tokenizers"]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
prmshift = "prmshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

